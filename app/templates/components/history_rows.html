{% for t in transitions %}
<tr>
    <td class="when"><span class="local-time" data-utc="{{ iso(t.created_at) }}"></span></td>
    <td>{{ names.get(t.watch_id, '#' ~ t.watch_id) }}</td>
    <td>
        <span class="state {{ t.from_bucket }}">{{ t.from_bucket }}</span>
        <span class="sub">→</span>
        <span class="state {{ t.to_bucket }}">{{ t.to_bucket }}</span>
        <span class="sub when">({{ t.to_state_name or '?' }})</span>
    </td>
    <td>
        {% if t.notified %}<span class="ok">sent</span>
        {% elif t.suppress_reason %}<span class="sub when">{{ t.suppress_reason }}</span>
        {% else %}<span class="sub">—</span>{% endif %}
    </td>
</tr>
{% else %}
<tr><td colspan="4" class="empty">No transitions recorded yet.</td></tr>
{% endfor %}
