<div class="bg-gray-800 rounded-lg border border-green-800 p-4">
    <div class="flex items-center justify-between mb-3">
        <h2 class="font-semibold">Edit: {{ channel.name }}</h2>
        <button onclick="document.getElementById('channel-edit-panel').innerHTML=''"
                class="text-gray-500 hover:text-gray-300 text-sm">✕ close</button>
    </div>
    <form hx-post="/api/channels/{{ channel.id }}" hx-target="#channel-rows" hx-swap="innerHTML"
          hx-on::after-request="if(event.detail.successful) document.getElementById('channel-edit-panel').innerHTML=''"
          class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">

        <label class="block">
            <span class="text-gray-400">Name</span>
            <input name="name" value="{{ channel.name }}" required
                   class="mt-1 w-full bg-gray-900 border border-gray-700 rounded px-2 py-1.5">
        </label>

        {% if plugin %}
        {% for f in plugin.config_fields %}
        <label class="block">
            <span class="text-gray-400">{{ f.label }}</span>
            <input name="config_{{ f.name }}" type="{{ f.input_type }}"
                   value="{{ (channel.config or {}).get(f.name, '') }}"
                   placeholder="{{ f.placeholder }}" {% if f.required %}required{% endif %}
                   class="mt-1 w-full bg-gray-900 border border-gray-700 rounded px-2 py-1.5">
        </label>
        {% endfor %}
        {% endif %}

        <label class="block md:col-span-2">
            <span class="text-gray-400">Test message (blank = built-in preview)</span>
            <textarea name="test_message" rows="3"
                      placeholder="{{ plugin.DEFAULT_TEST_MESSAGE if plugin else '' }}"
                      class="mt-1 w-full bg-gray-900 border border-gray-700 rounded px-2 py-1.5 font-mono text-xs">{{ channel.test_message or '' }}</textarea>
            <span class="text-xs text-gray-500">This is what the "Send test" button sends.</span>
        </label>

        <div class="md:col-span-2">
            <button type="submit" class="px-4 py-2 rounded bg-green-700 hover:bg-green-600 font-medium">Save</button>
        </div>
    </form>
</div>
