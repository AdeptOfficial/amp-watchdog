<section class="card editcard">
    <div class="card-head">
        <h2>// edit: {{ channel.name }}</h2>
        <button class="close" onclick="document.getElementById('channel-edit-panel').innerHTML=''">✕ close</button>
    </div>
    <form hx-post="/api/channels/{{ channel.id }}" hx-target="#channel-rows" hx-swap="innerHTML"
          hx-on::after-request="if(event.detail.successful) document.getElementById('channel-edit-panel').innerHTML=''"
          class="formgrid">

        <label class="field">Name
            <input name="name" value="{{ channel.name }}" required>
        </label>

        {% if plugin %}
        {% for f in plugin.config_fields %}
        <label class="field">{{ f.label }}
            <input name="config_{{ f.name }}" type="{{ f.input_type }}"
                   value="{{ (channel.config or {}).get(f.name, '') }}"
                   placeholder="{{ f.placeholder }}" {% if f.required %}required{% endif %}>
        </label>
        {% endfor %}
        {% endif %}

        <label class="field wide">Test message (blank = built-in preview)
            <textarea name="test_message" rows="3"
                      placeholder="{{ plugin.DEFAULT_TEST_MESSAGE if plugin else '' }}">{{ channel.test_message or '' }}</textarea>
            <span class="hint">This is what the "send test" button sends.</span>
        </label>

        <div class="wide">
            <button type="submit" class="btn primary">save</button>
        </div>
    </form>
</section>
